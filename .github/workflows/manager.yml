# Builds the manager app for all three desktops from one source, so nobody has to own a
# Mac or a Linux box to ship for them. Each is a single self-contained file.
#
# Pushing a tag like v0.8.0 also publishes them as a GitHub release, which is where the
# site and the README send people: an Actions artifact needs a GitHub login to download,
# and "sign in to get the app" is not how to hand someone a game console.
name: Manager app

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths: ["app/**", ".github/workflows/manager.yml"]
  pull_request:
    paths: ["app/**"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # A tagged build says which release it is; anything else is a development build.
      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"; fi

      - name: Publish
        working-directory: app/Tiltatron.Manager
        run: dotnet publish -c Release -r ${{ matrix.rid }} -o out -p:Version=${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v4
        with:
          name: tiltatron-manager-${{ matrix.rid }}
          path: |
            app/Tiltatron.Manager/out/tiltatron-manager
            app/Tiltatron.Manager/out/tiltatron-manager.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Windows gets the .exe as it is. The other two go in a tarball, because a bare file
      # downloaded from a web page loses its executable bit and a tarball keeps it.
      - name: Package
        run: |
          mkdir dist
          cp artifacts/tiltatron-manager-win-x64/tiltatron-manager.exe "dist/tiltatron-manager-${GITHUB_REF_NAME}-windows-x64.exe"
          for pair in osx-arm64:macos-arm64 linux-x64:linux-x64; do
            rid="${pair%%:*}"; name="${pair##*:}"
            chmod +x "artifacts/tiltatron-manager-$rid/tiltatron-manager"
            tar -C "artifacts/tiltatron-manager-$rid" -czf "dist/tiltatron-manager-${GITHUB_REF_NAME}-$name.tar.gz" tiltatron-manager
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "Tilt-a-tron ${GITHUB_REF_NAME}" "$@"
