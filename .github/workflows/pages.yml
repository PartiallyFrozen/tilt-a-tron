# Publishes the browser installer (site/) to GitHub Pages.
# site/ is self-contained: index.html, manifest.json, firmware/*.bin and img/,
# all refreshed by tools/make_release.ps1. Nothing else in the repo is published.
name: Installer site

on:
  push:
    branches: [master]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
